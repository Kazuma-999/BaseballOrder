spring.application.name=BaseballOrder
# サーバーのポート番号
server.port=8080

# データベース接続設定
spring.datasource.url=jdbc:mysql://localhost:3306/baseball_db?serverTimezone=Asia/Tokyo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatisの設定（SQLのログをエクリプスのコンソールに出力する設定）
logging.level.com.example.baseball.mapper=DEBUG