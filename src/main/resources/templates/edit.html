<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>選手編集 - 草野球オーダー作成</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="container">
		<h1>選手情報の編集</h1>

		<form th:action="@{/players/update}" th:object="${playerForm}" method="post">
			<input type="hidden" th:field="*{id}">

			<div class="form-group">
				<label for="name">選手名</label>
				<input type="text" th:field="*{name}" id="name" required>
			</div>

			<div class="form-group">
				<label for="uniformNumber">背番号</label>
				<input type="number" th:field="*{uniformNumber}" id="uniformNumber" required>
			</div>

			<div class="form-group">
				<label for="mainPosition">守備位置</label>
				<input type="text" th:field="*{mainPosition}" id="mainPosition" required>
			</div>

			<div class="action-buttons">
				<button type="submit" class="btn-edit">変更を保存する</button>
				<a th:href="@{/players}" class="btn-cancel">キャンセル</a>
			</div>
		</form>
	</div>
</body>

</html>
